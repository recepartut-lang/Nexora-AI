<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora AI - Profesyonel Asistan</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(156, 163, 175, 0.5); border-radius: 3px; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex overflow-hidden">

    <!-- Sol Menü (Sidebar) -->
    <aside id="sidebar" class="w-72 bg-gray-950 border-r border-gray-800 flex flex-col justify-between transition-all duration-300 z-20">
        <div>
            <!-- Üst Logo ve Yeni Sohbet Butonu -->
            <div class="p-4 border-b border-gray-800 flex flex-col gap-3">
                <div class="flex items-center justify-between">
                    <h1 class="font-bold text-lg text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500">Nexora AI</h1>
                    <button onclick="toggleSettingsModal()" class="text-gray-400 hover:text-white p-1 rounded-lg hover:bg-gray-800 transition" title="Ayarlar / API Anahtarı">
                        ⚙️
                    </button>
                </div>
                <button onclick="startNewChat()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 px-4 rounded-xl flex items-center justify-center gap-2 transition shadow-lg shadow-blue-600/20">
                    <span>+</span> Yeni Sohbet
                </button>
            </div>

            <!-- Sohbetlerde Ara -->
            <div class="p-3 border-b border-gray-800">
                <input type="text" id="searchInput" placeholder="Sohbetlerde ara..." onkeyup="filterChats()" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-200 focus:outline-none focus:border-blue-500">
            </div>

            <!-- Sol Menü Sekmeleri / Modlar -->
            <div class="p-3 border-b border-gray-800 space-y-1">
                <button onclick="switchTab('resimler')" class="w-full text-left px-3 py-2 rounded-lg text-sm text-gray-300 hover:bg-gray-800 hover:text-white flex items-center gap-2 transition">🖼️ Resimler</button>
                <button onclick="switchTab('kitaplik')" class="w-full text-left px-3 py-2 rounded-lg text-sm text-gray-300 hover:bg-gray-800 hover:text-white flex items-center gap-2 transition">📚 Kitaplık</button>
                <button onclick="switchTab('sihirli')" class="w-full text-left px-3 py-2 rounded-lg text-sm text-gray-300 hover:bg-gray-800 hover:text-white flex items-center gap-2 transition">✨ Sihirli İçerik</button>
                <button onclick="switchTab('notdefteri')" class="w-full text-left px-3 py-2 rounded-lg text-sm text-gray-300 hover:bg-gray-800 hover:text-white flex items-center gap-2 transition">📝 Not Defteri</button>
            </div>

            <!-- Son Kullanılanlar Bölümü -->
            <div class="p-3">
                <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2 px-1">Son Kullanılanlar</h3>
                <div id="chatHistoryList" class="space-y-1 overflow-y-auto custom-scrollbar" style="max-height: calc(100vh - 420px);">
                    <!-- Dinamik olarak dolacak -->
                </div>
            </div>
        </div>

        <!-- Alt Bilgi / Profil -->
        <div class="p-4 border-t border-gray-800 text-xs text-gray-500 flex items-center justify-between">
            <span>Sürüm 2.5</span>
            <span class="text-green-400">● Çevrimiçi</span>
        </div>
    </aside>

    <!-- Ana İçerik Alanı -->
    <main class="flex-1 flex flex-col h-full bg-gray-900 relative">
        <!-- Üst Bar -->
        <header class="h-14 border-b border-gray-800 flex items-center justify-between px-6 bg-gray-900/50 backdrop-blur">
            <div class="flex items-center gap-3">
                <span id="currentChatTitle" class="font-medium text-gray-200">Yeni Sohbet</span>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="toggleSettingsModal()" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-lg border border-gray-700 transition">
                    🔑 API Anahtarı
                </button>
            </div>
        </header>

        <!-- Mesajların Listelendiği Alan -->
        <div id="chatContainer" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 custom-scrollbar">
            <!-- Karşılama Ekranı -->
            <div id="welcomeScreen" class="h-full flex flex-col items-center justify-center text-center max-w-md mx-auto space-y-4">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-3xl shadow-xl shadow-blue-500/10">
                    ✨
                </div>
                <h2 class="text-2xl font-bold text-white">Bugün size nasıl yardımcı olabilirim?</h2>
                <p class="text-gray-400 text-sm">Sorularınızı sorun, projeler geliştirin veya alt menüden medya araçlarını kullanın.</p>
            </div>
        </div>

        <!-- Alt Mesaj Yazma Paneli & Araçlar -->
        <div class="p-4 bg-gray-900 border-t border-gray-800">
            <div class="max-w-4xl mx-auto space-y-2">
                <!-- Medya ve İçerik Üretim Butonları -->
                <div class="flex items-center gap-2 overflow-x-auto pb-1 text-xs">
                    <button onclick="insertToolAction('+ Ekle')" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-lg border border-gray-700 transition whitespace-nowrap">+ Ekle</button>
                    <button onclick="insertToolAction('Video Ekle')" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-lg border border-gray-700 transition whitespace-nowrap">🎥 Video Ekle</button>
                    <button onclick="insertToolAction('Dosya Ekle')" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-lg border border-gray-700 transition whitespace-nowrap">📁 Dosya Ekle</button>
                    <button onclick="insertToolAction('Drive dan Ekle')" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-lg border border-gray-700 transition whitespace-nowrap">🌐 Drive'dan Ekle</button>
                    <button onclick="insertToolAction('Fotoğraf Oluştur')" class="bg-indigo-900/40 hover:bg-indigo-900/70 text-indigo-300 px-3 py-1.5 rounded-lg border border-indigo-700/50 transition whitespace-nowrap">🎨 Fotoğraf Oluştur</button>
                    <button onclick="insertToolAction('Video Oluştur')" class="bg-indigo-900/40 hover:bg-indigo-900/70 text-indigo-300 px-3 py-1.5 rounded-lg border border-indigo-700/50 transition whitespace-nowrap">🎬 Video Oluştur</button>
                    <button onclick="insertToolAction('Müzik Oluştur')" class="bg-indigo-900/40 hover:bg-indigo-900/70 text-indigo-300 px-3 py-1.5 rounded-lg border border-indigo-700/50 transition whitespace-nowrap">🎵 Müzik Oluştur</button>
                    <button onclick="insertToolAction('Canvas Ekle')" class="bg-blue-900/40 hover:bg-blue-900/70 text-blue-300 px-3 py-1.5 rounded-lg border border-blue-700/50 transition whitespace-nowrap">🪄 Canvas Ekle</button>
                </div>

                <!-- Yazışma Alanı -->
                <div class="relative flex items-center">
                    <textarea id="userInput" rows="1" placeholder="Mesajınızı yazın..." onkeydown="handleKeyPress(event)" class="w-full bg-gray-800 border border-gray-700 rounded-2xl pl-4 pr-14 py-3 text-gray-100 placeholder-gray-400 focus:outline-none focus:border-blue-500 resize-none max-h-32"></textarea>
                    <button onclick="sendMessage()" class="absolute right-2 bg-blue-600 hover:bg-blue-500 text-white p-2 rounded-xl transition shadow-md">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Ayarlar / API Anahtarı Modalı -->
    <div id="settingsModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl w-full max-w-md p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-white">API Ayarları</h3>
                <button onclick="toggleSettingsModal()" class="text-gray-400 hover:text-white">✕</button>
            </div>
            <p class="text-sm text-gray-400">Google AI Studio'dan aldığınız Gemini API anahtarınızı buraya girin.</p>
            <input type="password" id="apiKeyInput" placeholder="AIzaSy..." class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-blue-500">
            <div class="flex justify-end gap-3 pt-2">
                <button onclick="toggleSettingsModal()" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-xl text-sm">İptal</button>
                <button onclick="saveApiKey()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-sm font-medium">Kaydet</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Kodları -->
    <script>
        let chats = JSON.parse(localStorage.getItem('nexora_chats')) || [];
        let currentChatId = localStorage.getItem('nexora_current_chat') || null;
        let apiKey = localStorage.getItem('gemini_api_key') || '';

        window.onload = function() {
            if (!apiKey) {
                toggleSettingsModal();
            }
            renderChatList();
            if (currentChatId) {
                loadChat(currentChatId);
            }
        };

        function toggleSettingsModal() {
            const modal = document.getElementById('settingsModal');
            modal.classList.toggle('hidden');
            modal.classList.toggle('flex');
            if(!modal.classList.contains('hidden')) {
                document.getElementById('apiKeyInput').value = apiKey;
            }
        }

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                apiKey = key;
                toggleSettingsModal();
                alert('API anahtarı başarıyla kaydedildi!');
            }
        }

        function startNewChat() {
            currentChatId = 'chat_' + Date.now();
            localStorage.setItem('nexora_current_chat', currentChatId);
            renderChatList();
            clearChatUI();
        }

        function switchTab(tabName) {
            const titles = {
                'resimler': 'Resimler Arşivi',
                'kitaplik': 'Kitaplık',
                'sihirli': 'Sihirli İçerik',
                'notdefteri': 'Not Defteri'
            };
            document.getElementById('currentChatTitle').innerText = titles[tabName] || 'Nexora AI';
            const container = document.getElementById('chatContainer');
            container.innerHTML = `
                <div class="h-full flex flex-col items-center justify-center text-center max-w-md mx-auto space-y-4">
                    <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-purple-600 to-blue-600 flex items-center justify-center text-3xl shadow-xl">📂</div>
                    <h2 class="text-2xl font-bold text-white">${titles[tabName]} Modülü</h2>
                    <p class="text-gray-400 text-sm">Bu alan seçtiğiniz kategoriye özel araçları ve içerikleri yönetmeniz için hazırlandı.</p>
                </div>
            `;
        }

        function insertToolAction(toolName) {
            const input = document.getElementById('userInput');
            input.value = `[${toolName}] ile ilgili işlem yapmak istiyorum: `;
            input.focus();
        }

        function clearChatUI() {
            const container = document.getElementById('chatContainer');
            container.innerHTML = `
                <div id="welcomeScreen" class="h-full flex flex-col items-center justify-center text-center max-w-md mx-auto space-y-4">
                    <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-3xl shadow-xl shadow-blue-500/10">✨</div>
                    <h2 class="text-2xl font-bold text-white">Bugün size nasıl yardımcı olabilirim?</h2>
                    <p class="text-gray-400 text-sm">Sorularınızı sorun, projeler geliştirin veya alt menüden medya araçlarını kullanın.</p>
                </div>
            `;
            document.getElementById('currentChatTitle').innerText = 'Yeni Sohbet';
        }

        function renderChatList() {
            const listEl = document.getElementById('chatHistoryList');
            listEl.innerHTML = '';
            
            chats.forEach(chat => {
                const div = document.createElement('div');
                div.className = `group flex items-center justify-between p-2.5 rounded-xl cursor-pointer text-sm transition ${chat.id === currentChatId ? 'bg-gray-800 text-white' : 'text-gray-400 hover:bg-gray-800/50 hover:text-gray-200'}`;
                div.onclick = () => loadChat(chat.id);
                
                div.innerHTML = `
                    <span class="truncate flex-1 pr-2">${chat.title}</span>
                    <button onclick="deleteChat(event, '${chat.id}')" class="opacity-0 group-hover:opacity-100 text-gray-500 hover:text-red-400 p-1">✕</button>
                `;
                listEl.appendChild(div);
            });
        }

        function loadChat(chatId) {
            currentChatId = chatId;
            localStorage.setItem('nexora_current_chat', chatId);
            const chat = chats.find(c => c.id === chatId);
            if (!chat) return;

            document.getElementById('currentChatTitle').innerText = chat.title;
            const container = document.getElementById('chatContainer');
            container.innerHTML = '';

            chat.messages.forEach(msg => {
                appendMessageUI(msg.role, msg.text, false);
            });
            container.scrollTop = container.scrollHeight;
            renderChatList();
        }

        function deleteChat(event, chatId) {
            event.stopPropagation();
            chats = chats.filter(c => c.id !== chatId);
            localStorage.setItem('nexora_chats', JSON.stringify(chats));
            if (currentChatId === chatId) {
                startNewChat();
            } else {
                renderChatList();
            }
        }

        function filterChats() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const listEl = document.getElementById('chatHistoryList');
            const items = listEl.children;
            
            chats.forEach((chat, index) => {
                const match = chat.title.toLowerCase().includes(query);
                items[index].style.display = match ? 'flex' : 'none';
            });
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            if (!apiKey) {
                alert('Lütfen önce ayarlar bölümünden API anahtarınızı girin!');
                toggleSettingsModal();
                return;
            }

            if (!currentChatId) {
                startNewChat();
            }

            let chat = chats.find(c => c.id === currentChatId);
            if (!chat) {
                chat = { id: currentChatId, title: text.substring(0, 25) + '...', messages: [] };
                chats.unshift(chat);
            } else if (chat.messages.length === 0) {
                chat.title = text.substring(0, 25) + '...';
            }

            input.value = '';
            
            const welcome = document.getElementById('welcomeScreen');
            if (welcome) welcome.remove();

            appendMessageUI('user', text, true);
            chat.messages.push({ role: 'user', text: text });
            saveAndRefresh();

            const loadingId = 'loading_' + Date.now();
            appendMessageUI('model', 'Yazıyor...', true, loadingId);

            try {
                // En güncel ve garantili model adı (gemini-1.5-flash-latest)
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: chat.messages.map(m => ({
                            role: m.role === 'user' ? 'user' : 'model',
                            parts: [{ text: m.text }]
                        }))
                    })
                });

                const data = await response.json();
                const loadingEl = document.getElementById(loadingId);

                if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts) {
                    const reply = data.candidates[0].content.parts[0].text;
                    if (loadingEl) loadingEl.remove();
                    appendMessageUI('model', reply, true);
                    chat.messages.push({ role: 'model', text: reply });
                    saveAndRefresh();
                } else {
                    if (loadingEl) loadingEl.remove();
                    let errDetail = data.error ? data.error.message : 'Bilinmeyen API Hatası';
                    appendMessageUI('model', `Hata: ${errDetail}`, true);
                }
            } catch (err) {
                const loadingEl = document.getElementById(loadingId);
                if (loadingEl) loadingEl.remove();
                appendMessageUI('model', 'Bağlantı hatası oluştu (Lütfen API anahtarınızı kontrol edin).', true);
            }
        }

        function appendMessageUI(role, text, scroll = true, customId = null) {
            const container = document.getElementById('chatContainer');
            const wrapper = document.createElement('div');
            if (customId) wrapper.id = customId;
            wrapper.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'} w-full mb-4`;

            const bubble = document.createElement('div');
            bubble.className = `max-w-[80%] rounded-2xl px-4 py-3 text-sm leading-relaxed ${role === 'user' ? 'bg-blue-600 text-white rounded-br-sm' : 'bg-gray-800 text-gray-200 border border-gray-700 rounded-bl-sm'}`;
            
            if (role === 'model' && customId === null) {
                bubble.innerHTML = marked.parse(text);
            } else {
                bubble.innerText = text;
            }

            wrapper.appendChild(bubble);
            container.appendChild(wrapper);
            if (scroll) container.scrollTop = container.scrollHeight;
        }

        function saveAndRefresh() {
            localStorage.setItem('nexora_chats', JSON.stringify(chats));
            renderChatList();
        }
    </script>
</body>
</html>
