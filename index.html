<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Asistanı</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Markdown desteği -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .prose h1 { font-size: 1.25rem; font-weight: 600; margin-top: 1em; margin-bottom: 0.5em; }
        .prose p { margin-bottom: 1em; }
        .prose ul { list-style: disc; margin-left: 1.5em; margin-bottom: 1em; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex flex-col justify-between">

    <!-- Üst Bilgi -->
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-lg">AI</div>
            <h1 class="font-semibold text-lg text-slate-900">Yapay Zeka Asistanı</h1>
        </div>
        <button onclick="toggleSettings()" class="text-sm text-slate-500 hover:text-indigo-600 font-medium transition flex items-center gap-1">
            ⚙️ API Anahtarı
        </button>
    </header>

    <!-- API Anahtarı Paneli -->
    <div id="settings-panel" class="hidden bg-slate-900 text-white px-6 py-3 items-center justify-between text-sm">
        <div class="flex items-center space-x-3 w-full max-w-2xl mx-auto">
            <span class="whitespace-nowrap font-medium">API Key:</span>
            <input type="password" id="api-key-input" placeholder="Google AI Studio'dan aldığınız anahtarı buraya yapıştırın" class="bg-slate-800 border border-slate-700 px-3 py-1.5 rounded w-full focus:outline-none focus:border-indigo-500 text-white placeholder:text-slate-500">
            <button onclick="saveApiKey()" class="bg-indigo-600 px-5 py-1.5 rounded font-medium hover:bg-indigo-500 transition">Kaydet</button>
        </div>
    </div>

    <!-- Sohbet Alanı -->
    <main id="chat-container" class="chat-container flex-1 overflow-y-auto px-4 py-6 space-y-6 max-w-4xl w-full mx-auto">
        <div class="flex items-start space-x-4">
            <div class="w-10 h-10 rounded-full bg-indigo-600 text-white flex items-center justify-center shrink-0 font-bold text-lg">AI</div>
            <div class="bg-white border border-slate-100 rounded-3xl p-6 shadow-sm text-slate-700 max-w-[80%]">
                Merhaba! Sohbete başlamak için lütfen sağ üstteki menüden API anahtarınızı girin.
            </div>
        </div>
    </main>

    <!-- Alt Kısım -->
    <footer class="bg-white border-t border-slate-100 p-5 mt-auto sticky bottom-0">
        <div class="max-w-4xl mx-auto flex items-center space-x-3 bg-slate-100 border border-slate-200 rounded-2xl p-1.5">
            <input type="text" id="user-input" placeholder="Mesajınızı yazın..." class="flex-1 bg-transparent px-4 py-2 focus:outline-none text-slate-900" onkeydown="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()" class="bg-indigo-600 text-white px-6 py-2.5 rounded-xl hover:bg-indigo-700 transition shadow font-medium">
                Gönder
            </button>
        </div>
    </footer>

    <script>
        // En güncel ve kararlı model tanımlaması
        const MODEL_NAME = "gemini-3.6-flash";

        function toggleSettings() {
            const panel = document.getElementById('settings-panel');
            panel.classList.toggle('hidden');
            panel.classList.toggle('flex');
        }

        function saveApiKey() {
            const key = document.getElementById('api-key-input').value.trim();
            if(key) {
                localStorage.setItem('gemini_api_key', key);
                alert('✅ API Anahtarı başarıyla kaydedildi!');
                toggleSettings();
            } else {
                alert('❌ Lütfen geçerli bir anahtar girin.');
            }
        }

        window.onload = function() {
            const savedKey = localStorage.getItem('gemini_api_key');
            if(savedKey) {
                document.getElementById('api-key-input').value = savedKey;
            }
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatContainer = document.getElementById('chat-container');
            const userText = inputField.value.trim();
            const apiKey = localStorage.getItem('gemini_api_key');

            if (!userText) return;

            if (!apiKey) {
                alert('⚠️ Lütfen sağ üstten API anahtarınızı girin.');
                return;
            }

            inputField.value = '';

            // Kullanıcı mesajını ekle
            chatContainer.innerHTML += `
                <div class="flex items-start justify-end space-x-4">
                    <div class="bg-indigo-600 text-white rounded-3xl px-6 py-4 shadow-sm max-w-[80%]">
                        ${escapeHtml(userText)}
                    </div>
                </div>
            `;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Yükleniyor mesajı
            const loadingDiv = document.createElement('div');
            loadingDiv.className = "flex items-start space-x-4";
            loadingDiv.innerHTML = `
                <div class="w-10 h-10 rounded-full bg-indigo-600 text-white flex items-center justify-center shrink-0 font-bold">AI</div>
                <div class="bg-white border border-slate-100 rounded-3xl p-6 shadow-sm text-slate-400 max-w-[80%] animate-pulse">
                    Yapay zeka düşünüyor...
                </div>
            `;
            chatContainer.appendChild(loadingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: userText }] }]
                    })
                });

                const data = await response.json();
                loadingDiv.remove();

                if (!response.ok) {
                    throw new Error(data.error ? data.error.message : 'Bağlantı hatası oluştu');
                }

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    chatContainer.innerHTML += `
                        <div class="flex items-start space-x-4">
                            <div class="w-10 h-10 rounded-full bg-indigo-600 text-white flex items-center justify-center shrink-0 font-bold">AI</div>
                            <div class="bg-white border border-slate-100 rounded-3xl p-6 shadow-sm text-slate-700 max-w-[80%] prose">
                                ${marked.parse(aiReply)}
                            </div>
                        </div>
                    `;
                } else {
                    throw new Error('Yapay zekadan yanıt alınamadı.');
                }
            } catch (error) {
                if(loadingDiv) loadingDiv.remove();
                chatContainer.innerHTML += `
                    <div class="flex items-start space-x-4">
                        <div class="w-10 h-10 rounded-full bg-red-600 text-white flex items-center justify-center shrink-0 font-bold">!</div>
                        <div class="bg-red-50 border border-red-200 rounded-3xl p-6 shadow-sm text-red-600 max-w-[80%]">
                            <b>Hata:</b> ${error.message}
                        </div>
                    </div>
                `;
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
